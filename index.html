<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madayaw Davao - Curated Tourism Portal & QR Business Card</title>
  <meta name="description" content="Discover the best of Davao City. 100% verified tourist spots, restaurants, cafes, and hotels with scannable QR business card and Google Maps navigation." />
  <meta name="theme-color" content="#0F172A" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Madayaw Davao - Curated Tourism Portal & QR Business Card" />
  <meta property="og:description" content="Explore verified Davao City destinations with modern whitespace, high-resolution photography, and direct Google Maps navigation." />
  <meta property="og:type" content="website" />

  <!-- Preload Essential Assets -->
  <link rel="preload" href="assets/images/hero-davao.jpg" as="image" />

  <!-- Design System Stylesheets -->
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/card.css" />
  <link rel="stylesheet" href="src/styles/portal.css" />
  <link rel="stylesheet" href="src/styles/map.css" />
</head>
<body>

  <!-- Sticky Header & Category Navigation Mount -->
  <div id="navbar-mount"></div>

  <!-- Main Application Content -->
  <main id="main-content" role="main">
    
    <!-- Hero Section Mount -->
    <div id="hero-mount"></div>

    <!-- Interactive 3D Business Card Mount -->
    <div id="business-card-mount"></div>

    <!-- Curated Location Gallery Mount -->
    <div id="gallery-mount"></div>

    <!-- Interactive Geographic Map Mount -->
    <div id="map-mount"></div>

  </main>

  <!-- Global Footer Mount -->
  <footer id="footer-mount" class="app-footer" role="contentinfo"></footer>

  <!-- Detail Modal Mount -->
  <div id="modal-mount"></div>

  <!-- Application Bootstrap Script -->
  <script type="module" src="src/app.js"></script>

</body>
</html>
